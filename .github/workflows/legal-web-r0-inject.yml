name: MercaTax Web Legal R0 Injector

on:
  push:
    branches:
      - teki/legal-privacy-web-r0

permissions:
  contents: write

jobs:
  inject-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: teki/legal-privacy-web-r0
          fetch-depth: 0

      - name: Inject legal footer and capture runtime inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import urlparse

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = 'data-mercatax-legal-footer="r0"'

          if marker not in text:
              footer = '''\n<footer data-mercatax-legal-footer="r0" aria-label="Enlaces legales" style="background:#050505;border-top:1px solid #252525;color:#a7a7ad;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;padding:22px 16px;text-align:center;position:relative;z-index:2">\n  <a href="/terms.html" style="color:#e5e5e7;text-decoration:none;margin:0 10px">Términos y Condiciones</a>\n  <span aria-hidden="true" style="color:#666">•</span>\n  <a href="/privacy.html" style="color:#e5e5e7;text-decoration:none;margin:0 10px">Política de Privacidad</a>\n</footer>\n'''
              match = list(re.finditer(r"</body\s*>", text, flags=re.IGNORECASE))
              if not match:
                  raise SystemExit("index.html has no closing body tag; refusing non-deterministic injection")
              pos = match[-1].start()
              text = text[:pos] + footer + text[pos:]
              path.write_text(text, encoding="utf-8")

          lower = text.lower()
          patterns = {
              "Google Analytics / gtag": ["googletagmanager.com", "gtag("],
              "Google Tag Manager": ["gtm.js", "googletagmanager.com/gtm"],
              "Firebase": ["firebase"],
              "reCAPTCHA": ["recaptcha"],
              "Meta/Facebook Pixel": ["fbq(", "facebook.com/tr"],
              "Stripe": ["stripe.com", "js.stripe.com"],
              "PayPal": ["paypal.com", "paypalobjects.com"],
              "WhatsApp": ["wa.me", "whatsapp.com"],
              "Formspree": ["formspree"],
              "HubSpot": ["hubspot"],
              "Mailchimp": ["mailchimp"],
          }
          emails = sorted(set(re.findall(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", text)))
          urls = re.findall(r"https?://[^\"'<>\s)]+", text)
          hosts = sorted({urlparse(u).hostname for u in urls if urlparse(u).hostname})

          lines = [
              "# MercaTax Web — Legal Runtime Inventory R0",
              "",
              "Generated from the exact `index.html` candidate. This file is evidence for privacy-policy review; it is not itself a policy.",
              "",
              "## Known integration signatures",
              "",
          ]
          for label, needles in patterns.items():
              found = any(n.lower() in lower for n in needles)
              lines.append(f"- {label}: {'FOUND' if found else 'not detected'}")
          lines.extend(["", "## Email addresses present in the artifact", ""])
          lines.extend([f"- `{email}`" for email in emails] or ["- none detected"])
          lines.extend(["", "## External hosts referenced by absolute URL", ""])
          lines.extend([f"- `{host}`" for host in hosts] or ["- none detected"])
          lines.extend(["", "## Legal footer", "", f"- Marker `{marker}`: {'FOUND' if marker in text else 'MISSING'}", "- `/terms.html`: " + ("FOUND" if "/terms.html" in text else "MISSING"), "- `/privacy.html`: " + ("FOUND" if "/privacy.html" in text else "MISSING"), ""])
          Path("LEGAL_RUNTIME_INVENTORY.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Verify legal resources
        shell: bash
        run: |
          set -euo pipefail
          test -s terms.html
          test -s privacy.html
          test -s legal.css
          grep -Fq 'data-mercatax-legal-footer="r0"' index.html
          grep -Fq 'href="/terms.html"' index.html
          grep -Fq 'href="/privacy.html"' index.html
          grep -Fq 'Términos y Condiciones' terms.html
          grep -Fq 'Política de Privacidad' privacy.html

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html LEGAL_RUNTIME_INVENTORY.md && git ls-files --error-unmatch LEGAL_RUNTIME_INVENTORY.md >/dev/null 2>&1; then
            echo "Legal footer already materialized; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html LEGAL_RUNTIME_INVENTORY.md
          git commit -m "feat(legal): materialize MercaTax web footer links"
          git push origin HEAD:teki/legal-privacy-web-r0
