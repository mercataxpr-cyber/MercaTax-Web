name: MercaTax Web GA4 Sitewide Patch

on:
  push:
    branches:
      - teki/mercatax-web-ga4-r1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analytics branch
        uses: actions/checkout@v4
        with:
          ref: teki/mercatax-web-ga4-r1
          fetch-depth: 0

      - name: Inject GA4 loader sitewide and align privacy inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = '  <script src="/analytics.js" defer></script>\n'
          updated = []

          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts or path.name.startswith('google'):
                  continue
              text = path.read_text(encoding='utf-8')
              if '/analytics.js' in text:
                  continue
              if '</head>' not in text:
                  raise SystemExit(f'Missing </head> in {path}')
              text = text.replace('</head>', tag + '</head>', 1)
              path.write_text(text, encoding='utf-8')
              updated.append(str(path))

          privacy = Path('privacy.html')
          text = privacy.read_text(encoding='utf-8')
          old = ('El sitio y su infraestructura de alojamiento también pueden generar información técnica necesaria para entregar y proteger el servicio, como dirección IP, tipo de navegador o dispositivo, fecha y hora de acceso, páginas solicitadas y registros técnicos o de seguridad. El inventario técnico del candidato vigente no detectó Google Analytics, Google Tag Manager, Meta Pixel, Firebase, Stripe ni PayPal integrados en la página. Si en el futuro se incorporan analítica, publicidad u otros servicios que amplíen la recopilación de datos, esta política deberá actualizarse para reflejar el comportamiento real antes de su uso.')
          new = ('El sitio y su infraestructura de alojamiento también pueden generar información técnica necesaria para entregar y proteger el servicio, como dirección IP, tipo de navegador o dispositivo, fecha y hora de acceso, páginas solicitadas y registros técnicos o de seguridad. MercaTax utiliza Google Analytics 4 para medir de forma agregada el uso del sitio, incluyendo páginas vistas, interacción con el contenido, dispositivo o navegador, fuente de tráfico y eventos de medición mejorada habilitados en la propiedad. La integración de este sitio utiliza el identificador de medición G-36LMR9ZYWD y mantiene desactivadas las señales de publicidad y la personalización publicitaria en la configuración implementada por MercaTax.')
          if old not in text:
              raise SystemExit('Expected privacy inventory paragraph was not found')
          privacy.write_text(text.replace(old, new, 1), encoding='utf-8')

          inventory = Path('LEGAL_RUNTIME_INVENTORY.md')
          text = inventory.read_text(encoding='utf-8')
          text = text.replace('- Google Analytics / gtag: not detected', '- Google Analytics / gtag: FOUND — G-36LMR9ZYWD')
          if '- `www.googletagmanager.com`' not in text:
              marker = '## External hosts referenced by absolute URL\n\n'
              text = text.replace(marker, marker + '- `www.googletagmanager.com`\n', 1)
          inventory.write_text(text, encoding='utf-8')

          pages = [p for p in sorted(Path('.').rglob('*.html')) if '.git' not in p.parts and not p.name.startswith('google')]
          missing = [str(p) for p in pages if '/analytics.js' not in p.read_text(encoding='utf-8')]
          if missing:
              raise SystemExit('GA4 loader missing from: ' + ', '.join(missing))
          if 'G-36LMR9ZYWD' not in Path('analytics.js').read_text(encoding='utf-8'):
              raise SystemExit('Measurement ID missing from analytics.js')

          print(f'Injected /analytics.js into {len(updated)} HTML files')
          print(f'Validated {len(pages)} HTML files')
          PY

      - name: Commit generated sitewide integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No sitewide changes needed"
            exit 0
          fi
          git config user.name "MercaTax Automation"
          git config user.email "mercataxpr@gmail.com"
          git add -- '*.html' LEGAL_RUNTIME_INVENTORY.md
          git commit -m "feat(analytics): wire GA4 across MercaTax Web"
          git push origin HEAD:teki/mercatax-web-ga4-r1
